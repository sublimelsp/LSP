name: Test Community Packages

on:
  pull_request:

jobs:
  type-check:
    name: Type-check community packages
    runs-on: macOS-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7

      - name: Type-check community packages
        uses: sublimelsp/lsp_maintainers@main
        with:
          local: LSP=.
          preferred-branch: ${{ github.head_ref }}
