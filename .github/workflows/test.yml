name: Test & Lint

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/docs.yml"
      - "docs/**"
  # Runs on all pull requests, including docs-only ones, because the "Require CI" ruleset requires its checks.
  pull_request:

concurrency:
  # Cancel superseded runs of the same pull request. Runs on main get a unique group so that they are never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  Unittesting:
    name: Unittesting (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: SublimeText/UnitTesting/actions/setup@v1
      - uses: SublimeText/UnitTesting/actions/run-tests@v1
        with:
          coverage: true

  # A single check that sums up the Unittesting jobs on all platforms, for the "Require CI" ruleset to require.
  Unittesting-result:
    name: Unittesting result
    needs: Unittesting
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Unittesting result
        env:
          RESULT: ${{ needs.Unittesting.result }}
        run: |
          echo "Unittesting result: $RESULT"
          test "$RESULT" = success

  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: pip3 install tox --user
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: tox
